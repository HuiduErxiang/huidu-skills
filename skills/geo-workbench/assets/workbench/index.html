<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问见 · GEO 研究工作台</title>
<style>
:root{--bg:#f5f5f1;--ink:#203b36;--muted:#7c8983;--green:#23735d;--line:#e3e7df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 15px}button:hover{border-color:#7eac96}.report-link{display:inline-block;border:1px solid #23735d;border-radius:10px;padding:9px 15px;background:#23735d;color:#fff;font-size:13px}.report-link:hover{background:#195942}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:#fff;border-color:var(--green)}aside{width:224px;background:#eef0e8;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column}.logo{font-size:25px;letter-spacing:3px;font-weight:750}.logo small{display:block;letter-spacing:2px;font-size:10px;font-weight:500;color:var(--muted)}.nav{margin-top:42px;border-radius:10px;background:#dfe7d9;padding:12px 15px;font-weight:650}.side-label{margin:30px 12px 12px;color:var(--muted);font-size:11px;letter-spacing:2px}.history{overflow:auto}.history button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px}.history button.active{background:#e2e8dc}.history small{display:block;color:var(--muted);font-size:11px}.local{margin-top:auto;font-size:12px;color:var(--muted);padding-top:20px}.dot{display:inline-block;width:6px;height:6px;background:#5e9673;border-radius:50%;margin-right:6px}main{max-width:1380px;margin-left:224px;padding:36px 46px 60px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.pill{padding:5px 10px;border:1px solid var(--line);border-radius:30px;background:white;font-size:11px}h1{font-size:34px;letter-spacing:-1px;margin:30px 0 5px}h2{font-size:18px;margin:0 0 18px}h3{font-size:14px;margin:0 0 10px}p{margin:6px 0 18px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:350px 1fr;gap:24px;margin-top:28px}.card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:25px}.card+.card{margin-top:20px}label.field{display:block;margin:18px 0 6px;font-weight:600;font-size:12px}input[type=text],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fbfcf9;outline:none}input:focus,textarea:focus{border-color:var(--green)}.checks{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}.choice:has(input:checked){border-color:#7caa8d;background:#eef5ed}.choice input{accent-color:var(--green);vertical-align:middle;margin:0 5px 0 0}.estimate{border-top:1px dashed var(--line);padding-top:15px;margin:24px 0 18px;color:var(--muted);font-size:12px}.estimate strong{color:var(--green);font-size:20px}.wide{width:100%}.runhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.runhead h2{margin:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.metric{background:#f6f7f2;padding:14px;border-radius:12px}.metric strong{display:block;font-size:25px;font-weight:650}.metric span{color:var(--muted);font-size:11px}.bar{height:6px;background:#edf0e8;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#639779;transition:width .3s}.stages{display:flex;gap:10px;margin:14px 0 24px;color:var(--muted);font-size:11px}.stages span{flex:1;border-top:2px solid #dce5d9;padding-top:7px}.notice{border:1px solid #e8d9b8;background:#fffbef;border-radius:12px;padding:16px;margin:18px 0}.notice p{font-size:12px;margin:5px 0 10px}.notice.info{background:#f0f5ee;border-color:#dce8d8}.actions{display:flex;gap:8px;flex-wrap:wrap}.tasks{display:grid;gap:8px}.task{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.task p{margin:2px 0 0;font-size:12px;color:var(--muted)}.status{font-size:11px;white-space:nowrap;padding:3px 9px;border-radius:20px;background:#f0f2ec;color:#7a887d}.status.done,.status.completed{color:#267556;background:#eaf4e9}.status.needs_user,.status.failed{color:#9a6c22;background:#fff3da}.status.running{color:#42788b;background:#eaf4f6}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted)}details{margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:12px}summary{cursor:pointer;font-size:12px}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.8 inherit;background:#f7f8f4;padding:15px;border-radius:8px;max-height:330px;overflow:auto}.events{max-height:180px;overflow:auto}.event{padding:9px 0;font-size:12px;border-bottom:1px solid #f0f2eb}.event time{font-size:10px;color:var(--muted);display:inline-block;width:64px}#error{color:#9a4c39;background:#fff1e9;padding:10px;display:none;border-radius:9px;margin-top:12px}.empty{padding:55px 10px;text-align:center;color:var(--muted)}a{color:var(--green);text-decoration:none}.small{font-size:11px}.footer{font-size:11px;color:var(--muted);margin-top:24px}@media(max-width:1100px){main{padding:25px}.grid{grid-template-columns:300px 1fr}aside{width:190px}main{margin-left:190px}}@media(max-width:800px){aside{display:none}main{margin:0;padding:22px 16px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
<aside><div class="logo">◈ 问见<small>GEO RESEARCH STUDIO</small></div><div class="nav">◉　研究工作台</div><div class="side-label">最近研究</div><div class="history" id="history"></div><div class="local"><span class="dot"></span>本地工作空间<br><span class="small">数据保存在这台电脑</span></div></aside>
<main><div class="top"><span>研究工作台 / 产品可见度</span><span class="pill">聊天执行模式 · 本地运行</span></div><h1>从一个关键词，看见用户的问题。</h1><p class="muted">收集搜索联想，探索 AI 追问，观察产品如何出现在回答中。</p>
<div class="grid"><section><form class="card" id="form"><h2>新建研究</h2><label class="field" for="product">目标产品</label><input id="product" type="text" value="莱博雷生" maxlength="100" required><label class="field" for="keyword">种子关键词</label><input id="keyword" type="text" value="失眠" maxlength="100" required><label class="field">搜索平台</label><div class="checks" id="searches"></div><label class="field">AI 平台</label><div class="checks" id="ais"></div><div class="estimate">固定 <b>3</b> 个入口 · <b>1</b> 层追问<br>预计 <strong id="estimate">20</strong> 次 AI 提交，另含 <span id="searchCount">4</span> 个平台采集</div><button class="primary wide" id="submit">创建研究任务 →</button><div id="error" role="alert"></div><p class="muted small" style="margin:12px 0 0">请先在聊天中调用 GEO 技能，再在这里填写并创建研究。聊天等待期间，点击创建后将由当前聊天接手；若聊天已结束，请回聊天说“继续研究”。</p></form><div class="card" id="platformChecks" style="margin-top:18px"></div><div class="footer">每题独立会话 · 保留原始表达<br>不核验引用链接 · 不生成模拟采集结果</div></section>
<section id="workspace" aria-live="polite"></section></div></main>
<script>
let config,runs=[],selected,editing=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={queued:'等待执行',waiting_agent:'等待聊天启动',waiting_chat:'等待聊天启动',running:'执行中',done:'已完成',completed:'已完成',needs_user:'需要操作',failed:'未成功',paused:'已暂停',select_questions:'选择入口'};const kind={search:'搜索联想',answer:'回答测试',clarification:'追问探索'};
async function api(path,body){const res=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await res.json();if(!res.ok)throw Error(d.error||'请求失败');return d}
function checked(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function estimate(){$('#estimate').textContent=checked('ais').length*4;$('#searchCount').textContent=checked('searches').length}
function badge(s){return `<span class="status ${esc(s)}">${esc(labels[s]||s)}</span>`}
function render(){const r=runs.find(x=>x.id===selected);$('#history').innerHTML=runs.map(x=>`<button data-run="${esc(x.id)}" class="${x.id===selected?'active':''}">${esc(x.product)} · ${esc(x.keyword)}<small>${esc(labels[x.status])} · ${x.tasks.filter(t=>t.status==='done').length}/${x.tasks.length}</small></button>`).join('');if(!r){$('#workspace').innerHTML='<div class="card empty">创建一项研究，从真实搜索联想开始。</div>';return}const done=r.tasks.filter(t=>t.status==='done').length,answers=r.tasks.filter(t=>t.kind==='answer'&&t.status==='done'),mentions=answers.filter(t=>t.mentions).length,percent=r.status==='completed'?100:Math.round(done/(r.searches.length+r.ais.length*4)*100),needs=r.tasks.filter(t=>t.status==='needs_user');
let notices='';if(['waiting_chat','waiting_agent','queued'].includes(r.status))notices=`<div class="notice info"><b>任务已保存，等待当前聊天执行</b><p>如果当前聊天正在等待你的操作，创建后会接手执行；若聊天已结束，请回聊天说“继续研究”。进度和提示都在本页显示。</p><span class="small">任务编号 ${esc(r.id)}</span></div>`;if(r.status==='failed')notices=`<div class="notice"><b>当前步骤未成功，记录已保留</b><p>${esc(r.events.at(-1)?.text||'请在当前聊天中继续处理此步骤')}</p><button data-control="resume">标记重试</button></div>`;if(r.status==='paused')notices='<div class="notice"><b>任务已暂停</b><p>已完成的记录会保留。继续后从未完成步骤接着执行。</p></div>';for(const t of needs)notices+=`<div class="notice"><b>${esc(t.platform)} 需要你操作</b><p>${esc(t.notice||'请在浏览器中完成登录，然后点击下方按钮。')}</p><div class="actions"><a href="${esc(config.urls[t.platform])}" target="_blank" rel="noreferrer">打开 ${esc(t.platform)} ↗</a><button data-control="resume">我已完成，重新检查</button></div></div>`;
let questions='';if(r.status==='select_questions')questions=`<div class="card"><h2>选定 3 个入口问题</h2><p class="muted small">根据下方真实联想选择，保持不同意图。确认后生成 ${r.ais.length*4} 次 AI 任务。</p><form id="questions">${[0,1,2].map(i=>`<input aria-label="入口问题${i+1}" name="q" type="text" required placeholder="入口问题 ${i+1}" style="margin:6px 0">`).join('')}<button class="primary" style="margin-top:12px">确认入口并生成测试</button></form></div>`;
$('#workspace').innerHTML=`<div class="card"><div class="runhead"><h2>${esc(r.product)} <span class="muted">/ ${esc(r.keyword)}</span></h2>${badge(r.status)}</div><div class="metrics"><div class="metric"><strong>${done}<span> / ${r.tasks.length}</span></strong><span>已完成采集任务</span></div><div class="metric"><strong>${r.suggestions.length}</strong><span>真实搜索联想</span></div><div class="metric"><strong>${mentions}<span> / ${answers.length}</span></strong><span>回答中提及产品</span></div></div><div class="bar" role="progressbar" aria-label="研究进度" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${percent}%"></i></div><div class="stages"><span>01 搜索联想</span><span>02 三个入口</span><span>03 多 AI 测试</span><span>04 汇总结果</span></div>${notices}<div class="actions">${!['completed','paused'].includes(r.status)?'<button data-control="pause">暂停任务</button>':''}${r.status==='paused'?'<button class="primary" data-control="resume">标记可以继续</button>':''}${r.status==='completed'?`<a href="/api/runs/${encodeURIComponent(r.id)}/report" target="_blank" rel="noopener" class="report-link">查看 HTML 报告 ↗</a><a href="/api/runs/${encodeURIComponent(r.id)}/report/download" class="report-link">下载 HTML ↓</a>`:''}<button id="export">导出原始记录 ↓</button></div></div>${questions}<div class="card"><h2>执行进度</h2><div class="tasks">${r.tasks.map(t=>`<div class="task"><div><b>${esc(t.platform)}</b> <span class="small muted">${esc(kind[t.kind])}</span><p>${esc(t.kind==='clarification'?'围绕第一个入口提出 3 条澄清问题':t.question)}</p>${t.notice&&t.status!=='done'?`<p>${esc(t.notice)}</p>`:''}</div>${badge(t.status)}</div>`).join('')}</div></div>${answers.length?`<div class="card"><h2>产品可见度</h2><table><thead><tr><th>入口问题</th>${r.ais.map(a=>`<th>${esc(a)}</th>`).join('')}</tr></thead><tbody>${r.questions.map(q=>`<tr><td>${esc(q)}</td>${r.ais.map(a=>{const t=answers.find(x=>x.platform===a&&x.question===q);return `<td>${t?(t.mentions?'● 提及':'— 未提及'):'待采集'}</td>`}).join('')}</tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:12px">单轮样本，仅反映本次实际回答。提及不等于推荐，未采集不计为未提及。</p></div>`:''}${r.suggestions.length?`<div class="card"><h2>搜索联想 <span class="muted small">${r.suggestions.length} 条原始表达</span></h2>${r.searches.map(p=>`<details><summary>${esc(p)} · ${r.suggestions.filter(s=>s.platform===p).length} 条</summary>${r.suggestions.filter(s=>s.platform===p).map(s=>`<div class="event"><span class="muted">${esc(s.rank)}.</span> ${esc(s.text)}</div>`).join('')}</details>`).join('')}</div>`:''}<div class="card"><h2>原始回答与追问</h2>${r.tasks.filter(t=>t.status==='done'&&t.kind!=='search').map(t=>`<details><summary>${esc(t.platform)} · ${t.kind==='clarification'?'3 条澄清问题':esc(t.question)}</summary><pre>${esc(t.response)}</pre></details>`).join('')||'<p class="muted">实际采集后在这里展示，不生成示例回答。</p>'}</div><div class="card"><h2>任务动态</h2><div class="events">${r.events.slice().reverse().map(e=>`<div class="event"><time>${esc(new Date(e.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}))}</time>${esc(e.text)}</div>`).join('')}</div></div>`;
$('#questions')?.addEventListener('focusin',()=>editing=true);$('#questions')?.addEventListener('submit',async e=>{e.preventDefault();try{await api(`runs/${r.id}/questions`,{questions:[...e.target.querySelectorAll('input')].map(x=>x.value)});editing=false;await refresh()}catch(err){alert(err.message)}});$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download=`GEO-${r.product}-${r.keyword}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}
async function refresh(){try{const next=await api('runs');if($('#error').textContent.startsWith('无法连接本地服务')){$('#error').style.display='none';$('#error').textContent=''}const changed=JSON.stringify(next)!==JSON.stringify(runs);runs=next;if(!selected)selected=runs[0]?.id;if(!editing&&(changed||!$('#workspace').innerHTML))render()}catch(e){$('#error').style.display='block';$('#error').textContent='无法连接本地服务：'+e.message}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-run],[data-control]');if(!b)return;try{if(b.dataset.run){selected=b.dataset.run;editing=false;render()}else{await api(`runs/${selected}/control`,{action:b.dataset.control});await refresh()}}catch(err){alert(err.message)}});
$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;try{const r=await api('runs',{product:$('#product').value,keyword:$('#keyword').value,searches:checked('searches'),ais:checked('ais')});selected=r.id;editing=false;await refresh();$('#error').style.display='none'}catch(err){$('#error').textContent=err.message;$('#error').style.display='block'}finally{$('#submit').disabled=false}};
(async()=>{config=await api('config');for(const key of ['searches','ais'])$('#'+key).innerHTML=config[key].map(x=>`<label class="choice"><input type="checkbox" name="${key}" value="${esc(x)}" checked>${esc(x)}</label>`).join('');$('#platformChecks').innerHTML='<h3>平台实测状态</h3>'+Object.entries(config.platform_checks||{}).map(([name,v])=>`<details><summary>${esc(name)} <span class="muted">${esc(v.label)}</span></summary><p class="small muted">${esc(v.note)}</p></details>`).join('');document.addEventListener('change',estimate);estimate();await refresh();setInterval(refresh,2500)})();
</script></html>
